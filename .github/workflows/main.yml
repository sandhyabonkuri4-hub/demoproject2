name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: docs

     - name: Check links
  uses: lycheeverse/lychee-action@v2
  with:
    args: --verbose './docs/**/*.html'
    failIfEmpty: false
    fail: true

      - name: Build preview
        run: |
          mkdir -p build
          cp -r docs/* build/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
